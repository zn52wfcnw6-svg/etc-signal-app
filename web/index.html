<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ETH永续信号监控">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ETH信号">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ETH永续信号监控 v3.47.1</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #0A0A0A; color: #fff; font-family: -apple-system, sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0A0A0A; z-index: 9999; }
    #loading .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #4CAF50; border-radius: 50%; animation: spin 1s linear infinite; }
    #loading .text { margin-top: 16px; color: #888; font-size: 14px; }
    #loading .version { margin-top: 8px; color: #555; font-size: 12px; }
    #error { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #0A0A0A; z-index: 9999; padding: 24px; text-align: center; }
    #error .icon { font-size: 48px; margin-bottom: 16px; }
    #error .title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f44336; }
    #error .msg { font-size: 12px; color: #888; margin-bottom: 24px; word-break: break-all; max-height: 200px; overflow: auto; }
    #error button { padding: 10px 24px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text">正在加载...</div>
    <div class="version">v3.47.1 最高版本</div>
  </div>
  <div id="error">
    <div class="icon">⚠️</div>
    <div class="title">应用加载失败</div>
    <div class="msg" id="error-msg"></div>
    <button onclick="location.reload()">刷新重试</button>
  </div>
  <script>
    // 监听Flutter应用加载完成
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.addedNodes.length > 0) {
          for (let i = 0; i < mutation.addedNodes.length; i++) {
            const node = mutation.addedNodes[i];
            if (node.tagName === 'FLUTTER-VIEW' || (node.querySelector && node.querySelector('flt-glass-pane'))) {
              document.getElementById('loading').style.display = 'none';
              observer.disconnect();
              return;
            }
          }
        }
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    
    window.addEventListener('error', function(e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
      document.getElementById('error-msg').textContent = e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
      document.getElementById('error-msg').textContent = 'Promise错误: ' + (e.reason ? e.reason.toString() : 'unknown');
    });
    setTimeout(function() {
      if (document.getElementById('loading').style.display !== 'none') {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
        document.getElementById('error-msg').textContent = '加载超时，请刷新重试。如果持续失败，请清除浏览器缓存后再试。';
      }
    }, 30000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
